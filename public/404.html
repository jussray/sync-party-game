<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#06142d" />
  <title>404 · SYNC</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f4fbff;background:radial-gradient(circle at 50% 0%,#1558d852,transparent 30rem),linear-gradient(180deg,#06142d,#020817 72%,#05091b)}
    main{width:min(680px,100%);padding:34px;border:1px solid #57e8ff44;border-radius:28px;background:#07172ddf;box-shadow:0 35px 120px #0008,0 0 80px #1ddfff18;text-align:center}
    .eyebrow{margin:0 0 10px;color:#31e5ff;font-size:.75rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 12px;font-size:clamp(44px,9vw,82px);line-height:.95;letter-spacing:-.05em}
    p{margin:0 auto 22px;max-width:34rem;color:#9eb9d8;line-height:1.6}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 18px;border-radius:15px;color:#001229;text-decoration:none;font-weight:900;background:linear-gradient(110deg,#20dbff,#3974ff 55%,#8d54ff)}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">SYNC · 404</p>
    <h1>Page not found.</h1>
    <p>This route is not part of the public SYNC surface.</p>
    <a href="/">Back to SYNC</a>
  </main>
</body>
</html>
