name: core-proof

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  core-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax checks
        run: |
          node --check src/game.js
          node --check src/worker.js
          node --check public/app.js
          node --check playwright.config.js
          python -m py_compile scripts/bugfinder.py
      - name: Pure game tests
        run: node --test test/*.test.mjs
      - name: Python bug finder
        run: python scripts/bugfinder.py
      - name: Install pinned runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Two-browser Wrangler runtime proof
        run: npm run test:e2e
        env:
          PW_TRACE: "on"
      - name: Preserve Playwright evidence (screenshots, traces, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  attack-proof:
    # Seeded 8-player attack harness against the real Worker + Durable Object (wrangler dev, local mode).
    # The two-context Playwright proof runs in core-proof above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Worker + Durable Object
        run: |
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/ && exit 0; sleep 1; done
          cat wrangler-dev.log; exit 1
      - name: Seeded 8-player attack harness
        run: |
          for seed in 7 11 23; do ATTACK_SEED=$seed ATTACK_GAMES=2 node scripts/attack.mjs; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-wrangler-log-${{ github.sha }}
          path: wrangler-dev.log
          retention-days: 30
