name: core-proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Syntax checks
        run: |
          node --check src/game.js
          node --check src/worker.js
          node --check public/app.js
          node --check playwright.config.js
          python -m py_compile scripts/bugfinder.py scripts/secret_scan.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Pure game tests
        run: node --test test/*.test.mjs
      - name: Python bug finder
        run: python scripts/bugfinder.py
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Two-browser Wrangler runtime proof
        run: npm run test:e2e
      - name: Preserve Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
