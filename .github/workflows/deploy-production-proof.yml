name: production-deploy-proof

on:
  workflow_run:
    workflows: ["core-proof"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-prove:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact green main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Bind deployment identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          printf 'DEPLOY_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Require Cloudflare deployment authority
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "BLOCKED: CLOUDFLARE_API_TOKEN is not available to this repository"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "BLOCKED: CLOUDFLARE_ACCOUNT_ID is not available to this repository"; exit 2; }

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy exact SHA to Cloudflare Workers
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 | sed 's/[),]$//')"
          test -n "$DEPLOY_URL" || { echo "Could not bind a workers.dev deployment URL from Wrangler output"; exit 3; }
          printf 'DEPLOY_URL=%s\n' "$DEPLOY_URL" >> "$GITHUB_ENV"
          printf 'url=%s\n' "$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public two-client Playwright proof
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:e2e

      - name: Write deployment proof receipt
        if: always()
        run: |
          mkdir -p deployment-proof
          {
            echo "repository=jussray/sync-party-game"
            echo "sha=${DEPLOY_SHA:-${{ github.event.workflow_run.head_sha }}}"
            echo "core_proof_run=${{ github.event.workflow_run.id }}"
            echo "deploy_workflow_run=${{ github.run_id }}"
            echo "deploy_url=${DEPLOY_URL:-UNKNOWN}"
            echo "deploy_step=${{ steps.deploy.outcome }}"
            echo "public_playwright_gate=${{ job.status }}"
          } > deployment-proof/receipt.txt
          cp deploy.log deployment-proof/deploy.log 2>/dev/null || true

      - name: Preserve production proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-proof-${{ github.event.workflow_run.head_sha }}
          path: |
            deployment-proof/
            playwright-report/
            test-results/
          if-no-files-found: warn
