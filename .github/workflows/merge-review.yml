name: Merge Review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["core-proof", "Agent Contract v1"]
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to re-evaluate against current head
        required: true
        type: number

permissions:
  contents: read
  checks: write
  statuses: read
  pull-requests: read

concurrency:
  group: sync-merge-review-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-review:
    if: >-
      (github.event_name == 'workflow_run' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'check_run' && github.event.check_run.name != 'merge-review') ||
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      # Trusted default-branch policy only. NEVER run code from a PR head.
      # checks:write publishes a bounded check-run on the exact PR head SHA.
      - name: Checkout trusted main release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Publish exact-head merge-review check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/merge-review-check.mjs
