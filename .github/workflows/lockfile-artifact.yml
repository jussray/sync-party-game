name: lockfile-artifact

on:
  push:
    branches: [proof]
    paths:
      - package.json
      - .github/workflows/lockfile-artifact.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Generate exact reviewed lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "803b9eeab23f5adcbf8473e52430d4c30180452295fa537fea1d4d8d5e35da8e  package-lock.json" | sha256sum --check --strict
      - name: Commit lockfile to proof only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: pin npm dependency graph"
          git push origin HEAD:proof
