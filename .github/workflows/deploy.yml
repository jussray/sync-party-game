name: Deploy

on:
  workflow_run:
    workflows: ["core-proof"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-party-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PRODUCTION_URL: https://sync-party-game.mcgill-raylene.workers.dev

jobs:
  promote-production:
    name: Promote exact leased green SHA to production
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_PROOF_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout exact green candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify candidate lease and fast-forward production authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid exact green SHA::TARGET_SHA must be a lowercase 40-character commit SHA."
            exit 1
          fi
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          printf 'Green candidate: %s\nChecked out: %s\nCurrent main: %s\nSource proof run: %s\n' "$TARGET_SHA" "$ACTUAL_HEAD_SHA" "$CURRENT_MAIN_SHA" "$SOURCE_PROOF_RUN_ID"
          test "$ACTUAL_HEAD_SHA" = "$TARGET_SHA"
          python3 scripts/deploy_candidate_guard.py "$TARGET_SHA" "$CURRENT_MAIN_SHA"

          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/production:refs/remotes/origin/production
            git merge-base --is-ancestor refs/remotes/origin/production "$TARGET_SHA" || {
              echo "::error title=Non-fast-forward production promotion::Existing production is not an ancestor of the exact leased green candidate."
              exit 1
            }
          fi

      - name: Fast-forward production branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$TARGET_SHA:refs/heads/production"

      - name: Record promotion receipt
        shell: bash
        run: |
          {
            echo "## SYNC production promotion"
            echo
            echo "- Exact green candidate SHA: \`$TARGET_SHA\`"
            echo "- Source core-proof run: \`$SOURCE_PROOF_RUN_ID\`"
            echo "- Candidate lease: revalidated against live main"
            echo "- Promotion: fast-forward only"
            echo "- Cloudflare mutation authority: provider-held Workers Builds token"
            echo "- Cloudflare production branch: \`production\`"
            echo "- Human button press: not required"
          } >> "$GITHUB_STEP_SUMMARY"

  production-proof:
    name: Public exact-SHA multiplayer proof
    needs: promote-production
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_PROOF_RUN_ID: ${{ github.event.workflow_run.id }}
      PLAYWRIGHT_BASE_URL: https://sync-party-game.mcgill-raylene.workers.dev
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Cloudflare Workers Build to expose this exact SHA
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 48); do
            body="$(curl --fail --silent --show-error --max-time 10 "$PLAYWRIGHT_BASE_URL/api/version" || true)"
            if DEPLOY_BODY="$body" EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module <<'NODE'
          const body = process.env.DEPLOY_BODY || "";
          const expected = process.env.EXPECTED_SHA || "";
          try {
            const value = JSON.parse(body);
            if (value?.service === "sync-party-game" && value?.sha === expected && typeof value?.build === "string" && value.build.length > 0) {
              console.log(`Exact deployed SHA verified: ${value.sha}; Cloudflare build: ${value.build}`);
              process.exit(0);
            }
          } catch {}
          process.exit(1);
          NODE
            then
              matched=1
              break
            fi
            echo "Waiting for exact Cloudflare deployment ($attempt/48)..."
            sleep 5
          done
          if [[ "$matched" != "1" ]]; then
            echo "::error title=Exact deployed SHA not observed::Cloudflare did not expose the production branch SHA within the proof window."
            exit 1
          fi

      - name: Run full multiplayer suite against public production
        run: npm run test:e2e

      - name: Write production proof receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          version_json="$(curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL/api/version")"
          DEPLOY_BODY="$version_json" EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module <<'NODE' > test-results/production-proof.txt
          const value = JSON.parse(process.env.DEPLOY_BODY);
          console.log(`repository=jussray/sync-party-game`);
          console.log(`sha=${process.env.EXPECTED_SHA}`);
          console.log(`cloudflare_build=${value.build}`);
          console.log(`source_proof_run=${process.env.SOURCE_PROOF_RUN_ID}`);
          console.log(`url=https://sync-party-game.mcgill-raylene.workers.dev`);
          console.log(`github_run_id=${process.env.GITHUB_RUN_ID}`);
          console.log(`proof=full Playwright suite against exact-SHA public Cloudflare deployment`);
          console.log(`result=VERIFIED`);
          NODE
          cat test-results/production-proof.txt
          {
            echo "## Public multiplayer proof"
            echo
            echo "- Exact deployed SHA: \`$EXPECTED_SHA\`"
            echo "- Source core-proof run: \`$SOURCE_PROOF_RUN_ID\`"
            echo "- Public URL: $PLAYWRIGHT_BASE_URL"
            echo "- Exact-SHA runtime identity: PASS"
            echo "- Playwright: PASS"
            echo "- Phone + laptop path: PASS"
            echo "- Hidden-choice privacy: PASS"
            echo "- Reconnect: PASS"
            echo "- Five rounds + results + same-room rematch: PASS"
            echo "- Durable Object timeout alarm: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve production proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-party-production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
