name: deploy-and-prove

# Deploys the real Worker + Durable Object + static assets to Cloudflare (workers.dev),
# then runs the same two-context Playwright proof and attack harness against the PUBLIC URL.
# Requires repository secrets CLOUDFLARE_API_TOKEN (Workers edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy BLOCKED: repository secret CLOUDFLARE_API_TOKEN is not set. Nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
      - if: steps.creds.outputs.configured == 'true'
        run: npm ci
      - name: Deploy to Cloudflare
        id: deploy
        if: steps.creds.outputs.configured == 'true'
        run: |
          npx wrangler deploy --message "commit ${GITHUB_SHA}" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          version=$(grep -oiE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}')
          [ -n "$url" ] || { echo "no workers.dev URL in deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          { echo "### Deployed"; echo "- URL: $url"; echo "- Version: ${version:-unknown}"; echo "- Commit: ${GITHUB_SHA}"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for public URL
        if: steps.creds.outputs.configured == 'true'
        run: for i in $(seq 1 30); do curl -sf -o /dev/null "${{ steps.deploy.outputs.url }}/" && exit 0; sleep 2; done; exit 1
      - if: steps.creds.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: Production Playwright proof (desktop + phone)
        if: steps.creds.outputs.configured == 'true'
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PW_TRACE: "on"
      - name: Production attack harness
        if: steps.creds.outputs.configured == 'true'
        run: ATTACK_BASE_URL="${{ steps.deploy.outputs.url }}" ATTACK_SEED=7 ATTACK_GAMES=1 node scripts/attack.mjs
      - if: always() && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-production-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            deploy.log
          retention-days: 30
